server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: qwen
    static_configs:
      - targets: [localhost]
        labels:
          job: qwen
          __path__: /var/log/qwen/*.log
    pipeline_stages:
      # Gateway logs are JSON when LOG_FORMAT=json; pull level out as a label.
      - json:
          expressions:
            level: level
      - labels:
          level:
