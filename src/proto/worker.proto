syntax = "proto3";
package qwenworker;

// gRPC contract between the Rust gateway and the Python MLX worker.
// Single source of truth: both sides codegen from this file.
service Worker {
  rpc Generate(Request) returns (stream Event);   // server-streaming token stream
  rpc Cancel(CancelReq) returns (Ack);
  rpc Health(Empty)     returns (HealthReply);
  rpc Check(Request)     returns (CheckReply);    // would Generate reject it? (before queueing)
  rpc Shutdown(Empty)   returns (Ack);
}

message Request {
  string id = 1;
  repeated Message messages = 2;       // OpenAI-style chat
  repeated string images = 3;          // PATHS/URLs, not bytes
  Params params = 4;
}
message Message {
  string role = 1; string content = 2;
  string name = 3;             // tool role: the function name that produced this result
  string tool_call_id = 4;     // tool role: which assistant tool_call this answers
  string tool_calls_json = 5;  // assistant role: JSON array of tool_calls it previously made
  optional string reasoning = 6;  // assistant role: earlier reasoning (vLLM `reasoning`)
}
message Params {
  // Absent = the client did not set it: the worker uses min(default_max_tokens,
  // what is left of the context). Set and too big for the context = error.
  optional uint32 max_tokens = 1;
  uint32 default_max_tokens = 13;
  reserved 4;                  // was enable_thinking: now in chat_template_kwargs_json
  optional uint32 thinking_budget = 5;  // absent = unlimited
  optional uint64 seed = 6; repeated string stop = 7;
  string tools_json = 8;       // OpenAI `tools` array as JSON (empty = no tools)
  string tool_choice = 9;      // "auto"|"none"|"required"|{...}; empty = auto
  optional bool parallel_tool_calls = 18;   // false = at most one call
  // Sampler; absent = worker env default.
  optional float temperature = 2;
  optional float top_p = 3;
  optional uint32 top_k = 10;
  optional float min_p = 11;
  optional float presence_penalty = 12;
  optional float frequency_penalty = 15;
  optional float repetition_penalty = 16;
  // OpenAI `response_format` object as JSON (json_object / json_schema); empty = text.
  string response_format_json = 14;
  // Extra chat-template variables as a JSON object (enable_thinking, ...); empty = none.
  string chat_template_kwargs_json = 17;
  // vLLM SamplingParams extras.
  uint32 min_tokens = 19;                  // EOS / stop_token_ids / stop strings only after this
  repeated uint32 stop_token_ids = 20;
  bool ignore_eos = 21;
  repeated string bad_words = 22;
  repeated uint32 allowed_token_ids = 23;
  bool include_stop_str_in_output = 24;
  optional bool add_generation_prompt = 25;  // absent = true
  bool continue_final_message = 26;
}

// A function/tool call the model decided to make. `arguments` is a JSON string.
message ToolCall { string id = 1; string name = 2; string arguments = 3; }

message Event {
  string id = 1;
  oneof kind { Start start = 2; Token token = 3; Done done = 4; Error error = 5; }
}
message Start { string role = 1; string model = 2; }   // model: id of the loaded model
message Token { string text = 1; bool thinking = 2; }   // thinking=true while inside <think>
message Done  { string finish = 1; Usage usage = 2; repeated ToolCall tool_calls = 3; }
message Error { string kind = 1; string msg = 2; }
message Usage {
  uint32 prompt_tokens = 1; uint32 gen_tokens = 2;
  float tps = 3;
  uint32 ttft_ms = 4;        // from the start of prefill (queue_ms is the wait before it):
                             // queue_ms + ttft_ms = arrival to first token
  float peak_gb = 5;
  uint32 reasoning_tokens = 6;
  uint32 queue_ms = 7;       // worker-side wait from arrival to the start of prefill
  float batch_mean = 8;      // mean number of rows in the decode steps this request took part in
  uint32 cached_tokens = 9;  // prompt tokens resumed from the prompt cache (not prefilled)
}

message CancelReq { string id = 1; }
// model: id of the loaded model (its weights dir name); model_path: what was loaded.
// max_batch: how many generations the worker decodes concurrently (1 = serialized).
// prompt_cache_*: the worker's prompt cache (QWEN_PROMPT_CACHE; all 0 when off):
// entries and live bytes now, lookups that hit / missed and entries evicted since start
// (a new entry not kept at store, over the batch's headroom, counts as an eviction).
message HealthReply {
  bool ready = 1; string model = 2; uint32 load_ms = 3; string model_path = 4;
  uint32 max_batch = 5;
  uint32 prompt_cache_entries = 6; uint64 prompt_cache_bytes = 7;
  uint64 prompt_cache_hits = 8; uint64 prompt_cache_misses = 9; uint64 prompt_cache_evictions = 10;
}
// error empty = ok; internal: the worker failed (500), else the request is bad (400)
message CheckReply { string error = 1; string model = 2; bool internal = 3; }
message Ack {}
message Empty {}
