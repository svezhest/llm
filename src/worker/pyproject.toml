[project]
name = "qwen-mlx-worker"
version = "0.1.0"
description = "Thin gRPC worker that loads the Qwen MLX VLM and streams tokens."
requires-python = ">=3.11"
dependencies = [
    "mlx-vlm==0.7.6",
    "grpcio>=1.68",
    "llguidance>=1.9.1",
    "mlx==0.32.3",
    "transformers>=5.14",
    "protobuf>=6.33.5,<7",
]

[dependency-groups]
proto = ["grpcio-tools>=1.68"]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false
